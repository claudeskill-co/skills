name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  catalogue:
    name: validate catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate skill frontmatter and identity
        run: node scripts/validate-skills.mjs
      - name: Fail if marketplace.json or registry.json is stale
        run: node scripts/gen-registry.mjs --check
      - name: Package skills for the upload surfaces
        run: node scripts/build-zips.mjs

  tests:
    # Every plugin that ships a tests/ directory, on every supported Python.
    # Adding a plugin adds it here by name so a new skill cannot land untested.
    name: ${{ matrix.plugin }} tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    strategy:
      fail-fast: false
      matrix:
        plugin: [db-guard, rls-audit, secret-sweep, stripe-check, token-screener, unit-economics]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (stdlib only, no install step)
        run: python -m unittest discover -s tests -v

  smoke:
    name: scripts run with no input
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: db-guard passes an ordinary command through
        working-directory: plugins/db-guard
        run: echo '{"tool_name":"Bash","tool_input":{"command":"ls -la"}}' | python skills/db-guard/scripts/db_guard.py --hook
      - name: rls-audit handles a directory that is not there
        working-directory: plugins/rls-audit
        run: python skills/rls-audit/scripts/rls_audit.py --path /nonexistent --strict
      - name: secret-sweep handles a directory that is not there
        working-directory: plugins/secret-sweep
        run: python skills/secret-sweep/scripts/secret_sweep.py --path /nonexistent --strict
      - name: stripe-check handles a directory that is not there
        working-directory: plugins/stripe-check
        run: python skills/stripe-check/scripts/stripe_check.py --path /nonexistent --strict
      - name: token-screener handles an empty transcript directory
        working-directory: plugins/token-screener
        run: python skills/token-screener/scripts/screen.py --root /nonexistent --all-projects
      - name: unit-economics produces a report from two figures
        working-directory: plugins/unit-economics
        run: python skills/unit-economics/scripts/unit_economics.py --price 1499 --cogs 420

  release:
    name: publish zips
    needs: [catalogue, tests, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/build-zips.mjs
      - name: Attach zips to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
